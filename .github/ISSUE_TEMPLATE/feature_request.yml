name: Feature request
description: 提议新的功能或维护改进
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 请说明真实使用场景，不要包含私人素材或敏感信息
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果有具体交互、CLI 或报告格式建议，请在这里说明
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 可选
  - type: checkboxes
    id: boundaries
    attributes:
      label: 安全边界
      options:
        - label: 该建议不依赖覆盖源 PSD 或上传私人 PSD
          required: true
