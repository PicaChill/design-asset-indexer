name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build packages
        run: python -m build

      - name: Smoke-test the built wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          smoke_venv="${RUNNER_TEMP}/design-asset-indexer-smoke"
          fixture_dir="${RUNNER_TEMP}/synthetic-fixtures"
          output_dir="${RUNNER_TEMP}/scan-output"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install --upgrade pip
          "${smoke_venv}/bin/python" -m pip install dist/*.whl
          "${smoke_venv}/bin/design-asset-index" --help
          "${smoke_venv}/bin/python" tests/generate_fixtures.py "${fixture_dir}"
          "${smoke_venv}/bin/design-asset-index" scan "${fixture_dir}" --out "${output_dir}"
          for required in inventory.csv inventory.jsonl archives.jsonl duplicates.json previews.jsonl summary.json; do
            test -f "${output_dir}/${required}"
          done
